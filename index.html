<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxPilot</title>
    <style>
    body {
    background: #111827;
}
body {
    color: #f9fafb;
}
.container {
    max-width: 700px;
    margin: 60px auto;
    padding: 40px;
    background: #1f2937;
    border-radius: 16px;
}
select,
input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    box-sizing: border-box;
    border: none;
    border-radius: 8px;
    background: #374151;
    color: #f9fafb;
    font-size: 16px;
}
button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}
</style>
</head>
<body>
    <div class="container">
<h1>TaxPilot</h1>

<p>Your business. Your taxes. One simple place.</p>

<button onclick="showForm()">Get started</button>

<div id="form" style="display: none;">
    
    <h2>Tell us about your business</h2>

    <label>What type of business do you have?</label>
    <select id="businessType">
        <option>LLC</option>
        <option>Sole Proprietorship</option>
        <option>Corporation</option>
        <option>Partnership</option>
    </select>

    <br><br>

    <label>Which state is your business in?</label>
    <select id="state">
        <option>Texas</option>
        <option>California</option>
        <option>Florida</option>
        <option>New York</option>
    </select>

    <br><br>

    <label>How many employees do you have?</label>
    <input id="employees" type="number" placeholder="Example: 2">

    <br><br>

    <label>What is your annual revenue?</label>
    <input id="revenue" type="number" placeholder="Example: 250000">
    <br><br>

<button type="button" onclick="continueForm()">Continue</button>
<div id="result"></div>
</div>

<script>
    function showForm() {
        document.getElementById("form").style.display = "block";
    }
    function continueForm() {
        const businessType = document.getElementById("businessType").value;
const state = document.getElementById("state").value;
const employees = document.getElementById("employees").value;
const revenue = document.getElementById("revenue").value;
let employeeRequirement = "";

if (Number(employees) > 0) {
    employeeRequirement = "Employer and payroll requirements";
} else {
    employeeRequirement = "No employees reported";
}
let stateRequirement = "";

if (state === "Texas") {
    stateRequirement = "Texas state tax obligations";
} else {
    stateRequirement = "State-specific tax obligations";
}
document.getElementById("result").innerHTML =
    "<h2>Your TaxPilot profile</h2>" +
    "<p><strong>Business type</strong><br>" + businessType + "</p>" +
    "<p><strong>State</strong><br>" + state + "</p>" +
    "<p><strong>Employees</strong><br>" + employees + "</p>" +
    "<p><strong>Annual revenue</strong><br>$" + revenue + "</p>" +
"<h2>Compliance overview</h2>" +
"<p>Based on your business profile:</p>" +
"<p><strong>3 potential compliance areas identified.</strong></p>" +
"<p>TaxPilot is preparing your personalized compliance requirements.</p>" +
"<ul>" +
"<li>Federal tax obligations</li>" +
"<li>" + stateRequirement + "</li>" +
"<li>" + employeeRequirement + "</li>" +
"<li>Required reports and filings</li>" +
"</ul>"
}
  
</script>

</div>

</body>
</html>
